<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOL Pump Alerts</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171a;--mu:#6b7280;--bd:#e5e7eb;--ok:#0f9d58;--bad:#d93025;--ac:#6d4aff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a1f;--tx:#e8eaed;--mu:#9aa0a6;--bd:#2a2e35;--ok:#34d399;--bad:#f87171;--ac:#8b7bff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:16px}
main{max-width:760px;margin:auto}h1{font-size:20px;margin:0 0 4px}p.s{color:var(--mu);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input.addr{flex:1;min-width:200px}input.num{width:70px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mu);font-weight:500;font-size:12px}.up{color:var(--ok);font-weight:600}.dn{color:var(--bad)}
.hit{background:rgba(52,211,153,.12)}a{color:var(--ac)}.mu{color:var(--mu);font-size:12px}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<main>
<h1>SOL Pump Alerts</h1>
<p class="s">Watches Solana tokens on DexScreener and notifies you when one rises above your threshold.</p>

<div class="card">
  <div class="row">
    <label>Alert when up more than <input id="th" class="num" type="number" value="10" min="0" step="1">%</label>
    <label>over <select id="tf"><option value="m5">5 min</option><option value="h1" selected>1 hour</option><option value="h6">6 hours</option><option value="h24">24 hours</option></select></label>
    <button id="en" class="g">Enable notifications</button>
  </div>
  <div class="mu" id="st" style="margin-top:8px">Checking every 30s.</div>
</div>

<div class="card">
  <div class="row">
    <input id="addr" class="addr" placeholder="Paste Solana token address (mint)">
    <button id="add">Add</button>
  </div>
  <div class="mu" style="margin-top:6px">Tip: copy the token address from its DexScreener page. Up to 30 tokens.</div>
</div>

<div class="card wrap">
  <table><thead><tr><th>Token</th><th>Price</th><th>Change</th><th>Liquidity</th><th></th></tr></thead>
  <tbody id="body"><tr><td colspan="5" class="mu">No tokens yet. Add one above.</td></tr></tbody></table>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let list=[],alerted=new Set(),data={};
try{list=JSON.parse(localStorage.getItem('tokens')||'[]');$('th').value=localStorage.getItem('th')||10;$('tf').value=localStorage.getItem('tf')||'h1'}catch(e){}
const save=()=>{try{localStorage.setItem('tokens',JSON.stringify(list));localStorage.setItem('th',$('th').value);localStorage.setItem('tf',$('tf').value)}catch(e){}};
const fmt=n=>n==null?'-':n>=1?n.toLocaleString(undefined,{maximumFractionDigits:2}):Number(n).toPrecision(3);
const usd=n=>n==null?'-':'$'+(n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0));
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.1;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function notify(t,ch){beep();if('Notification' in window&&Notification.permission==='granted'){new Notification(t.baseToken.symbol+' is up '+ch.toFixed(1)+'%',{body:'$'+fmt(+t.priceUsd)+' - click DexScreener to view'})}}
async function poll(){
  if(!list.length){render();return}
  try{
    const r=await fetch('https://api.dexscreener.com/tokens/v1/solana/'+list.join(','));
    const pairs=await r.json();data={};
    for(const p of pairs){const k=p.baseToken.address;if(!data[k]||(p.liquidity?.usd||0)>(data[k].liquidity?.usd||0))data[k]=p}
    const th=+$('th').value,tf=$('tf').value;
    for(const k in data){const ch=data[k].priceChange?.[tf];
      if(ch!=null&&ch>=th){if(!alerted.has(k)){alerted.add(k);notify(data[k],ch)}}else alerted.delete(k)}
    $('st').textContent='Last checked '+new Date().toLocaleTimeString()+'. Checking every 30s.';
  }catch(e){$('st').textContent='Could not reach DexScreener. Retrying...'}
  render();
}
function render(){
  const th=+$('th').value,tf=$('tf').value,b=$('body');
  if(!list.length){b.innerHTML='<tr><td colspan="5" class="mu">No tokens yet. Add one above.</td></tr>';return}
  b.innerHTML='';
  for(const k of list){
    const p=data[k],tr=document.createElement('tr');
    if(!p){tr.innerHTML='<td class="mu"></td><td colspan="3" class="mu">Loading or not found...</td><td></td>';tr.children[0].textContent=k.slice(0,6)+'...'}
    else{const ch=p.priceChange?.[tf];if(ch>=th)tr.className='hit';
      tr.innerHTML='<td></td><td>$'+fmt(+p.priceUsd)+'</td><td class="'+(ch>=0?'up':'dn')+'">'+(ch==null?'-':(ch>0?'+':'')+ch+'%')+'</td><td>'+usd(p.liquidity?.usd)+'</td><td></td>';
      const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener';a.textContent=p.baseToken.symbol;tr.children[0].appendChild(a)}
    const x=document.createElement('button');x.className='g';x.textContent='Remove';x.onclick=()=>{list=list.filter(i=>i!==k);alerted.delete(k);save();render()};
    tr.lastElementChild.appendChild(x);b.appendChild(tr);
  }
}
$('add').onclick=()=>{const v=$('addr').value.trim();if(v&&!list.includes(v)&&list.length<30){list.push(v);$('addr').value='';save();poll()}};
$('en').onclick=async()=>{if('Notification' in window){const r=await Notification.requestPermission();$('en').textContent=r==='granted'?'Notifications on':'Notifications blocked'}};
if('Notification' in window&&Notification.permission==='granted')$('en').textContent='Notifications on';
$('th').onchange=$('tf').onchange=()=>{alerted.clear();save();poll()};
poll();setInterval(poll,30000);
</script>
</body>
</html>
